<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Diet Tracker</h1>
        <button id="theme-toggle">Dark Mode</button>
    </header>
    <main>
        <section id="food-form">
            <h2>Add Food</h2>
            <form>
                <input type="text" id="food-name" placeholder="Food name" required>
                <input type="number" id="calories" placeholder="Calories" required>
                <input type="number" id="protein" placeholder="Protein (g)" required>
                <input type="number" id="carbs" placeholder="Carbs (g)" required>
                <input type="number" id="fat" placeholder="Fat (g)" required>
                <button type="submit">Add</button>
            </form>
        </section>
        <section id="food-list">
            <h2>Today's Food</h2>
            <div id="food-items"></div>
        </section>
        <section id="summary">
            <h2>Summary</h2>
            <div id="total-calories">Total Calories: 0</div>
            <div id="total-protein">Total Protein: 0g</div>
            <div id="total-carbs">Total Carbs: 0g</div>
            <div id="total-fat">Total Fat: 0g</div>
        </section>
        <section id="partnership-form">
            <h2>Partnership Inquiry</h2>
            <form action="https://formspree.io/f/mreybyvr" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Your Message" required></textarea>
                <button type="submit">Send Inquiry</button>
            </form>
        </section>
        <section id="comments">
            <h2>Comments</h2>
            <div id="disqus_thread"></div>
            <script>
                /**
                *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
                *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */
                /*
                var disqus_config = function () {
                this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
                this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
                };
                */
                (function() { // DON'T EDIT BELOW THIS LINE
                var d = document, s = d.createElement('script');
                s.src = 'https://diet-tracker.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
